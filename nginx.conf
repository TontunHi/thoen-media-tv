# ==============================================================================
# Nginx Configuration for Thoen Media TV (HTTPS / Port 443 + HTTP Redirect)
# ==============================================================================

# 1. HTTP Server Block (Port 80) -> Redirect ทั้งหมดไปยัง HTTPS (Port 443)
server {
    listen 80;
    server_name _; # หรือใส่ Domain เช่น tv.hospital.go.th หรือ IP

    # Redirect ทุก Request จาก HTTP ไปเป็น HTTPS
    return 301 https://$host$request_uri;
}

# 2. HTTPS Server Block (Port 443) -> Reverse Proxy ไปยัง Next.js App (Port 3000)
server {
    listen 443 ssl;
    server_name _; # หรือใส่ Domain / IP ของ Server

    # --------------------------------------------------------------------------
    # SSL Certificate Settings (ระบุ Path ของไฟล์ SSL Certificate และ Private Key)
    # --------------------------------------------------------------------------
    # ตัวอย่างสำหรับ Windows:
    # ssl_certificate     C:/nginx/ssl/certificate.crt;
    # ssl_certificate_key C:/nginx/ssl/private.key;
    #
    # ตัวอย่างสำหรับ Linux / Let's Encrypt:
    # ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_certificate     ssl/certificate.crt;
    ssl_certificate_key ssl/private.key;

    # SSL Security Protocols & Ciphers (TLS 1.2 & TLS 1.3)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # --------------------------------------------------------------------------
    # General Optimization & Body Size
    # --------------------------------------------------------------------------
    # รองรับการอัปโหลดไฟล์วิดีโอ/ภาพขนาดใหญ่สูงสุด 500MB
    client_max_body_size 500M;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # --------------------------------------------------------------------------
    # Main Application Proxy (Next.js Dashboard & TV Player)
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:5035;
        proxy_http_version 1.1;
        
        # รองรับ WebSocket สำหรับ Next.js
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # --------------------------------------------------------------------------
    # Real-time SSE Endpoint (Server-Sent Events) สำหรับจอทีวี
    # --------------------------------------------------------------------------
    location /api/screens/ {
        proxy_pass http://127.0.0.1:5035;
        proxy_http_version 1.1;
        
        # ปิด Buffering สำหรับ SSE เพื่อให้หน้าจอทีวีอัปเดตสื่อได้ทันที
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # --------------------------------------------------------------------------
    # Media Serving & Video Streaming (HTTP Range Support)
    # --------------------------------------------------------------------------
    location /api/media/ {
        proxy_pass http://127.0.0.1:5035;
        proxy_http_version 1.1;
        
        # รองรับ Range Headers สำหรับการเล่นวิดีโอบนทีวีแบบไหลลื่น
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
